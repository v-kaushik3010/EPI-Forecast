services:
  # ── Flask API (Backend) ──────────────────────────────────────────────────────
  - type: web
    name: epi-forecast-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt --prefer-binary
    startCommand: gunicorn --preload backend.app:app --workers 1 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /ping
    envVars:
      - key: CACHE_TTL_SECONDS
        value: 3600
      - key: MAX_FORECAST_DAYS
        value: 30
      - key: LOG_LEVEL
        value: INFO
      - key: PORT
        value: 10000

  # ── Streamlit Dashboard (Frontend) ───────────────────────────────────────────
  - type: web
    name: epi-forecast-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt --prefer-binary
    startCommand: >-
      streamlit run frontend/dashboard.py
      --server.port=$PORT
      --server.headless=true
      --server.enableCORS=false
      --server.enableXsrfProtection=false
    envVars:
      - key: BACKEND_URL
        value: https://epi-forecast-api-160c.onrender.com
